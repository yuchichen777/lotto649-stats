# 每期開獎後自動抓資料、產生網站並部署到 GitHub Pages
# 大樂透每週二、五 20:30（台灣時間）開獎，這裡在 22:30 與隔天早上 08:30 各跑一次（UTC 14:30 / 00:30）
name: Update & Deploy

on:
  schedule:
    - cron: "30 14 * * 2,5"
    - cron: "30 0 * * 3,6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest draws
        run: python scraper.py

      - name: Commit new data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update draw data"
            git push
          fi

      - name: Build site
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
